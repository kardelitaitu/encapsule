<!--
  encapsule — project logo

  Concept: a two-tone capsule (the name) with a bold arrow flowing through it
  (traffic transparently redirected through a socks5 tunnel), sitting on a
  rounded app tile with an indigo-to-violet gradient.

  Original work created for this project — no third-party assets.
  Renders: resources/encapsule.png, resources/encapsule.ico
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="64" y1="64" x2="448" y2="448">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#4C1D95"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="capLeft" gradientUnits="userSpaceOnUse" x1="0" y1="180" x2="0" y2="332">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="capRight" gradientUnits="userSpaceOnUse" x1="0" y1="180" x2="0" y2="332">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>

  <!-- capsule: left half (cyan) -->
  <path d="M256 180 L172 180 A76 76 0 0 0 96 256 A76 76 0 0 0 172 332 L256 332 Z" fill="url(#capLeft)"/>
  <!-- capsule: right half (violet) -->
  <path d="M256 180 L340 180 A76 76 0 0 1 416 256 A76 76 0 0 1 340 332 L256 332 Z" fill="url(#capRight)"/>
  <!-- capsule seam -->
  <rect x="254" y="180" width="4" height="152" fill="#FFFFFF" opacity="0.25"/>

  <!-- traffic arrow flowing through the capsule -->
  <g stroke="#FFFFFF" stroke-width="30" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="196" y1="256" x2="282" y2="256"/>
    <path d="M268 214 L316 256 L268 298"/>
  </g>
</svg>
